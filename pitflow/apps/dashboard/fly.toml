# PitFlow admin + landing — Nixpacks (no Dockerfile)
app = "pitflow-web"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    VITE_API_URL = "https://pitflow-api.fly.dev"
    VITE_CARE_URL = "https://pitflow-care.fly.dev"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
