services:
  db:
    image: postgis/postgis:16-3.4
    container_name: pitflow-db
    environment:
      POSTGRES_USER: pitflow
      POSTGRES_PASSWORD: pitflow
      POSTGRES_DB: pitflow
    ports:
      - "5432:5432"
    volumes:
      - pitflow_pgdata:/var/lib/postgresql/data

volumes:
  pitflow_pgdata:
